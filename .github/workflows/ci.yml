name: AML MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t aml-fraud-detection:latest .

      - name: Run container test
        run: |
          docker run -d -p 8000:8000 --name aml-test aml-fraud-detection:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop aml-test