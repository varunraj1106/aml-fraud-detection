apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-api
  labels:
    app: aml-fraud-detection
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aml-fraud-detection
  template:
    metadata:
      labels:
        app: aml-fraud-detection
    spec:
      containers:
        - name: aml-api
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/aml-fraud-detection:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: aml-api-service
spec:
  type: LoadBalancer
  selector:
    app: aml-fraud-detection
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aml-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aml-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70